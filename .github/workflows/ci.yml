name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify the GitHub Action's committed bundle is up to date
        run: |
          if ! git diff --exit-code -- apps/github-action/dist; then
            echo "::error::apps/github-action/dist is out of date. Run 'pnpm --filter @opspilot/github-action build' and commit the result."
            exit 1
          fi
