name: CI

on:
  push:
    branches: [main, test-on-more-node-versions-and-oses]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every cell finish, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
        include:
          # The oldest Node that "engines" in apps/bugzero/package.json promises to support.
          - os: ubuntu-latest
            node: 22.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: |
          pnpm --version 2>&1 | tee out.txt || true
          pnpm install --frozen-lockfile 2>&1 | tee -a out.txt || { echo "::error::$(tail -c 900 out.txt | tr "
" " ")"; exit 1; }

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
